[package]
name = "sweetrpg-game-systems-web"
version = "0.1.3"
edition = "2021"
rust-version = "1.98"
publish = false

[dependencies]
askama = "0.16"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
axum-prometheus = "0.10"
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-client"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
redis = { version = "1.5", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-i18n = "4.2"
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sentry-tracing = "0.49"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.7", features = ["trace", "fs"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"

[dev-dependencies]
serde_urlencoded = "0.7"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
