---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor

metadata:
    name: sweetrpg-game-systems-web
    labels:
        release: prometheus

spec:
    namespaceSelector:
        matchNames:
            - sweetrpg-game-systems
    podMetricsEndpoints:
        - port: http
    selector:
        matchLabels:
            app.kubernetes.io/name: game-systems-web
            app.kubernetes.io/version: v1
            app.kubernetes.io/component: web
            app.kubernetes.io/part-of: game-systems
